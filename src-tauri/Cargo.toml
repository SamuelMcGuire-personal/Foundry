[package]
name = "foundry-tauri-canary"
version = "0.1.0"
description = "Minimal Foundry Tauri shell canary"
authors = ["Foundry"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "foundry_tauri_canary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
