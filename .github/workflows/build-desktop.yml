name: Build Foundry Desktop
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"
jobs:
  mac:
    runs-on: macos-13
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Build macOS package
        run: npx electron-builder --mac zip dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-mac-${{ matrix.arch }}
          path: dist/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-Windows-x64
          path: dist/*
